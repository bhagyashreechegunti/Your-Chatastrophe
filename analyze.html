<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analyze | Chatastrophe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <nav class="nav-bar">
          <a href="index.html" class="brand-block">
            <span class="spark"></span>
            <span class="brand-label">What Did I Miss?</span>
          </a>
          <div class="nav-links">
            <a href="analyze.html">Analyze</a>
            <a href="history.html">Saved summaries</a>
          </div>
        </nav>
      </header>

      <main class="app-layout">
        <section class="composer panel">
          <div class="panel-header">
            <h1>Chatastrophe</h1>
            <h2>Catch up on what matters most.</h2>
          </div>

          <label class="input-label" for="chatInput">Paste a long chat or conversation thread</label>
          <textarea id="chatInput" spellcheck="false" aria-label="Conversation input"></textarea>

          <div class="actions-row">
            <button id="analyzeBtn" class="primary-btn">Analyze</button>
            <button id="sampleBtn" class="secondary-btn">Load sample</button>
            <button id="clearBtn" class="ghost-btn">Clear</button>
            <button id="saveBtn" class="action-btn ghost-btn">Save summary</button>
          </div>
        </section>

        <section class="results panel">
          <div class="summary-strip">
            <div class="metric-card">
              <span class="metric-label">Key updates</span>
              <strong id="metricSummary">0</strong>
            </div>
            <div class="metric-card">
              <span class="metric-label">Decisions</span>
              <strong id="metricDecisions">0</strong>
            </div>
            <div class="metric-card">
              <span class="metric-label">Action items</span>
              <strong id="metricActions">0</strong>
            </div>
            <div class="metric-card">
              <span class="metric-label">Urgency</span>
              <strong id="metricUrgency">Low</strong>
            </div>
          </div>

          <div class="result-box">
            <div class="section-heading-row">
              <h3>Priority briefing</h3>
              <span class="badge">Local-first</span>
            </div>
            <ul id="importanceList" class="bullet-list"></ul>
          </div>

          <div class="columns">
            <article class="result-box">
              <h3>Decision log</h3>
              <ul id="decisionList" class="stack-list"></ul>
            </article>

            <article class="result-box">
              <h3>Action items</h3>
              <ul id="actionList" class="stack-list"></ul>
            </article>
          </div>

          <div class="columns">
            <article class="result-box">
              <h3>Deadlines & mentions</h3>
              <ul id="deadlineList" class="stack-list"></ul>
            </article>

            <article class="result-box">
              <h3>Conversation signals</h3>
              <ul id="signalList" class="stack-list"></ul>
            </article>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
